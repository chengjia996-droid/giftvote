<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WHO WIN? Gift Vote</title>

<style>
:root{--u:1vw;--c0:#22d3c5;--c1:#ff4d8d;--c2:#b6f03c;--bga:.78}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;color:#fff;font-family:Montserrat,-apple-system,"SF Pro Display","Helvetica Neue","PingFang SC","Noto Sans SC",Arial,sans-serif;overflow:hidden}
body.preview{background:#3a3f4a}
#wrap{position:absolute;left:0;right:0;padding:calc(3*var(--u))}
#wrap.top{top:0}#wrap.center{top:50%;transform:translateY(-50%)}#wrap.bottom{bottom:0}
#box{background:rgba(10,10,14,var(--bga));border-radius:calc(4*var(--u));padding:calc(5*var(--u)) calc(4*var(--u)) calc(4.5*var(--u));box-shadow:0 calc(1*var(--u)) calc(5*var(--u)) rgba(0,0,0,.35);border:calc(.15*var(--u)) solid rgba(255,255,255,.07)}
h1{font-size:calc(10*var(--u));font-weight:900;letter-spacing:-.01em;line-height:1;text-align:center}
#sub{margin-top:calc(2.2*var(--u));font-size:calc(3.9*var(--u));font-weight:600;color:#d5d8df;display:flex;align-items:center;justify-content:center;gap:calc(1.6*var(--u))}
#sub b{color:#fff;font-weight:900;font-variant-numeric:tabular-nums}
#dot{width:calc(2*var(--u));height:calc(2*var(--u));border-radius:50%;background:#3ee07a;box-shadow:0 0 calc(2*var(--u)) #3ee07a;flex:none}
.running #dot{animation:pulse 1s infinite}
.urgent #sub b{color:#ff5a5a}
.urgent #dot{background:#ff5a5a;box-shadow:0 0 calc(2*var(--u)) #ff5a5a}
.idle #dot{background:#f5c542;box-shadow:0 0 calc(2*var(--u)) #f5c542;animation:none}
@keyframes pulse{50%{opacity:.35}}
hr{border:0;height:calc(.2*var(--u));background:rgba(255,255,255,.13);margin:calc(4*var(--u)) 0}
#cards{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(2.6*var(--u))}
.card{position:relative;background:linear-gradient(180deg,#22232b,#17181e);border:calc(.25*var(--u)) solid rgba(255,255,255,.08);border-radius:calc(3.4*var(--u));padding:calc(3.2*var(--u)) calc(1.5*var(--u)) calc(3*var(--u));text-align:center;transition:transform .4s,opacity .4s,border-color .4s,box-shadow .4s}
.card .ic{width:calc(15*var(--u));height:calc(15*var(--u));object-fit:contain;display:block;margin:0 auto calc(1.8*var(--u));filter:drop-shadow(0 calc(.6*var(--u)) calc(1.2*var(--u)) rgba(0,0,0,.45))}
.card .emo{font-size:calc(11*var(--u));line-height:calc(15*var(--u));height:calc(15*var(--u));margin-bottom:calc(1.8*var(--u))}
.card .lab{font-size:calc(2.6*var(--u));font-weight:800;letter-spacing:.16em}
.card .nm{font-size:calc(5.2*var(--u));font-weight:900;margin-top:calc(1*var(--u));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .gn{font-size:calc(3*var(--u));color:#c3c6ce;font-weight:600;margin-top:calc(1.2*var(--u));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cn{font-size:calc(2.7*var(--u));color:#f5c542;font-weight:700;margin-top:calc(.6*var(--u));display:flex;align-items:center;justify-content:center;gap:calc(.8*var(--u))}
.card .cn i{display:inline-block;width:calc(2.6*var(--u));height:calc(2.6*var(--u));border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#f5b800 60%,#c98a00);box-shadow:inset 0 0 0 calc(.3*var(--u)) rgba(0,0,0,.12)}
.card .vt{margin-top:calc(2.2*var(--u));font-size:calc(3.6*var(--u));font-weight:900;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.card .vt.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.25)}}
.card .pop{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-weight:900;font-size:calc(4.5*var(--u));pointer-events:none;animation:pop 1s forwards;text-shadow:0 0 calc(1*var(--u)) rgba(0,0,0,.6)}
@keyframes pop{to{transform:translate(-50%,calc(-9*var(--u)));opacity:0}}
.card .crown{display:none;position:absolute;top:calc(-3.2*var(--u));left:50%;transform:translateX(-50%);font-size:calc(2.6*var(--u));font-weight:900;letter-spacing:.14em;padding:calc(.8*var(--u)) calc(2*var(--u));border-radius:calc(5*var(--u));color:#111;white-space:nowrap}
.ended .card.win{transform:scale(1.05);border-color:var(--cc);box-shadow:0 0 calc(4*var(--u)) var(--cc),inset 0 0 calc(3*var(--u)) color-mix(in srgb,var(--cc) 25%,transparent)}
.ended .card.win .crown{display:block;background:var(--cc)}
.ended .card.lose{opacity:.42}
#cta{margin-top:calc(4*var(--u));text-align:center;font-size:calc(3*var(--u));font-weight:800;letter-spacing:.24em;color:#aeb2bd}
#bar{margin-top:calc(2.6*var(--u));height:calc(2.4*var(--u));border-radius:calc(2*var(--u));overflow:hidden;display:flex;background:rgba(255,255,255,.08)}
#bar div{height:100%;transition:flex-grow .6s ease;min-width:0}
#bar div+div{margin-left:calc(.4*var(--u))}
#st{position:fixed;right:6px;bottom:6px;font:12px/1.3 monospace;background:rgba(0,0,0,.7);padding:4px 7px;border-radius:6px;color:#ccc;max-width:70vw}
#st.ok{color:#5f5}#st.bad{color:#f88}
</style>
</head><body>

<script>
(function(){
const Q=new URLSearchParams(location.search);
const P=(k,d)=>Q.has(k)&&Q.get(k)!==''?Q.get(k):d;
const COLORS=[P('c1','#22d3c5'),P('c2','#ff4d8d'),P('c3','#b6f03c')].map(c=>c[0]=='#'?c:'#'+c);
const norm=s=>String(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[^a-z0-9\u4e00-\u9fff]/g,'');
const findGift=n=>GIFTS.find(g=>norm(g.name)===norm(n));
const cfg={
 title:P('title','WHO WIN?'),
 dur:Math.max(5,parseInt(P('t','20'))||20),
 mode:P('mode','count'), // count | coins
 names:[P('n1','A'),P('n2','B'),P('n3','C')],
 gifts:[P('g1','GG'),P('g2','Rose'),P('g3',"It's corn")],
 icons:[P('i1',''),P('i2',''),P('i3','')],
 ids:[P('id1',''),P('id2',''),P('id3','')],
 subRun:P('sub','{n} seconds to choose'),
 cta:P('cta','SEND A GIFT TO CHOOSE'),
 room:P('room',''),
 src:P('src',Q.get('key')?'euler':'none'),
 user:P('user','chengjiachen1').replace(/^@/,''),
 key:P('key',''), port:P('port','21213'),
 demo:P('demo','0')==='1', auto:P('auto','0')==='1', loop:parseInt(P('loop','0'))||0,
 hold:parseInt(P('hold','0'))||0, debug:P('debug','0')==='1', preview:P('preview','0')==='1'
};
document.documentElement.style.setProperty('--bga',P('bg','0.78'));
document.getElementById('wrap').className=P('pos','top');
if(cfg.preview)document.body.classList.add('preview');
document.getElementById('title').textContent=cfg.title;
document.getElementById('cta').textContent=cfg.cta;
const opts=[0,1,2].map(i=>{const g=findGift(cfg.gifts[i]);return{name:cfg.names[i],gift:g?g.name:cfg.gifts[i],img:cfg.icons[i]||(g&&g.img)||'',coins:parseInt(P('coin'+(i+1),g?g.coins:1))||1,id:cfg.ids[i]||(g&&g.id?String(g.id):''),color:COLORS[i],votes:0}});
// ---------- render ----------
const cardsEl=document.getElementById('cards'),barEl=document.getElementById('bar');
opts.forEach((o,i)=>{
 const c=document.createElement('div');c.className='card';c.style.setProperty('--cc',o.color);
 c.innerHTML=`<div class="crown">WINNER</div>${o.img?`<img class="ic" src="${o.img}">`:`<div class="emo">🎁</div>`}<div class="lab" style="color:${o.color}">OPTION ${'ABC'[i]}</div><div class="nm"></div><div class="gn"></div><div class="cn"><i></i><span>${o.coins} coin${o.coins>1?'s':''}</span></div><div class="vt">0 VOTES</div>`;
 c.querySelector('.nm').textContent=o.name;c.querySelector('.gn').textContent=o.gift;
 cardsEl.appendChild(c);o.el=c;
 const b=document.createElement('div');b.style.background=o.color;barEl.appendChild(b);o.bar=b;
});
const S={phase:'idle',endAt:0,left:cfg.dur};
function fmtV(n){return (n>=10000?(n/1000).toFixed(1)+'K':n)+(n===1?' VOTE':' VOTES')}
function draw(){
 const tot=opts.reduce((a,o)=>a+o.votes,0);
 opts.forEach(o=>{const v=o.el.querySelector('.vt'),t=fmtV(o.votes);if(v.textContent!==t){v.textContent=t;v.classList.remove('bump');void v.offsetWidth;v.classList.add('bump')}o.bar.style.flexGrow=tot?Math.max(o.votes,0):1});
 const box=document.getElementById('box');box.className=S.phase+(S.phase==='running'&&S.left<=5?' urgent':'');
 const sub=document.getElementById('subt');
 if(S.phase==='running'){sub.innerHTML=esc(cfg.subRun).replace('{n}','<b>'+S.left+'</b>').replace(/(<\/b>) seconds/,S.left===1?'$1 second':'$1 seconds')}
 else if(S.phase==='idle'){sub.innerHTML=esc(cfg.subRun).replace('{n}','<b>'+cfg.dur+'</b>')}
 else{const w=winners();sub.innerHTML=w.length===1?'Winner: <b style="color:'+w[0].color+'">'+esc(w[0].name)+'</b>':(w.length>1&&tot?'<b>TIE!</b> '+w.map(o=>esc(o.name)).join(' / '):'Voting closed')}
 if(S.phase==='ended'){const w=winners();opts.forEach(o=>{o.el.classList.toggle('win',w.includes(o)&&tot>0);o.el.classList.toggle('lose',!w.includes(o)&&tot>0)})}
 else opts.forEach(o=>o.el.classList.remove('win','lose'));
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function winners(){const m=Math.max(...opts.map(o=>o.votes));return opts.filter(o=>o.votes===m)}
// ---------- round control ----------
let loopT=null;
function start(sec){clearTimeout(loopT);opts.forEach(o=>o.votes=0);streak.clear();S.phase='running';S.dur=sec||cfg.dur;S.endAt=Date.now()+S.dur*1000;tick();draw();log('round started')}
function reset(){clearTimeout(loopT);opts.forEach(o=>o.votes=0);streak.clear();S.phase='idle';S.left=cfg.dur;draw();log('reset')}
function end(){if(S.phase!=='running')return;S.phase='ended';S.left=0;draw();log('round ended');
 if(cfg.loop||cfg.demo)loopT=setTimeout(()=>start(),(cfg.loop||6)*1000)}
function tick(){if(S.phase!=='running')return;const l=Math.max(0,Math.ceil((S.endAt-Date.now())/1000));if(l!==S.left){S.left=l;draw()}if(l<=0)end()}
setInterval(tick,200);
function addVotes(i,n,who){if(S.phase!=='running'&&!(S.phase==='idle'&&cfg.hold))return;if(!n)return;opts[i].votes=Math.max(0,opts[i].votes+n);draw();
 if(n>0){const p=document.createElement('div');p.className='pop';p.style.color=opts[i].color;p.textContent='+'+n;opts[i].el.appendChild(p);setTimeout(()=>p.remove(),1000)}}
// ---------- gift handling (combo-safe) ----------
const streak=new Map(),seen=new Set();
function matchOpt(id,name){for(let i=0;i<3;i++){if(opts[i].id&&id&&String(id)===opts[i].id)return i;if(norm(name)&&norm(name)===norm(opts[i].gift))return i}return -1}
function onGift(g){
 // g: {id,name,diamonds,repeat,repeatEnd,giftType,groupId,user,msgId}
 if(g.msgId){if(seen.has(g.msgId))return;seen.add(g.msgId);if(seen.size>5000)seen.clear()}
 const i=matchOpt(g.id,g.name);if(i<0)return;
 const rep=Math.max(1,parseInt(g.repeat)||1);let units;
 const streakable=g.combo!==undefined&&g.combo!==null?!!g.combo:(g.giftType===undefined||g.giftType===null?null:Number(g.giftType)===1);
 if(streakable===false){units=rep}
 else{const k=(g.user||'?')+'|'+(g.id||norm(g.name))+'|'+(g.groupId||'');const prev=streak.get(k)||0;units=rep>=prev?rep-prev:rep;streak.set(k,rep);if(streak.size>3000)streak.clear()}
 if(units<=0)return;
 const per=cfg.mode==='coins'?(parseInt(g.diamonds)||opts[i].coins):1;
 addVotes(i,units*per,g.user);
}
window.__gift=onGift;
// ---------- sources ----------
const st=document.getElementById('st');
function status(t,ok){if(!cfg.debug)return;st.style.display='block';st.textContent=t;st.className=ok?'ok':'bad'}
function log(t){if(cfg.debug)console.log('[giftvote]',t)}
function tikfinity(){
 let ws;const go=()=>{try{ws=new WebSocket('ws://localhost:'+cfg.port+'/')}catch(e){status('TikFinity: '+e.message,false);return setTimeout(go,3000)}
  ws.onopen=()=>status('TikFinity Desktop connected',true);
  ws.onclose=()=>{status('TikFinity Desktop not found (ws://localhost:'+cfg.port+') – retrying',false);setTimeout(go,3000)};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}if(m.event!=='gift')return;const d=m.data||{};
   onGift({id:d.giftId,name:d.giftName||(d.extendedGiftInfo&&d.extendedGiftInfo.name),diamonds:d.diamondCount,repeat:d.repeatCount,repeatEnd:d.repeatEnd,giftType:d.giftType,groupId:d.groupId,user:d.userId||d.uniqueId,msgId:d.msgId})}};
 go();
}
function euler(){
 let ws,delay=3000;const go=()=>{
  ws=new WebSocket('wss://ws.eulerstream.com?uniqueId='+encodeURIComponent(cfg.user)+'&apiKey='+encodeURIComponent(cfg.key));
  ws.onopen=()=>{status('Euler: connecting to @'+cfg.user+'…',true);delay=3000};
  ws.onclose=e=>{const r={4404:'not live yet',4401:'invalid API key',4400:'invalid options / username',4403:'no permission',4429:'too many connections',4005:'stream ended'}[e.code]||('closed '+e.code);if([4400,4401,4403].includes(e.code)){status('Euler: '+r+' – check key/username, not retrying',false);return}const wait=e.code===4404||e.code===4005?60000:delay;status('Euler: '+r+' – retry in '+Math.round(wait/1000)+'s',false);setTimeout(go,wait);delay=Math.min(delay*2,60000)};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}eulerMsg(m)}};go();
}
function eulerMsg(m){
   const list=m.messages||(Array.isArray(m)?m:[m]);
   for(const x of list){const t=x.type||'',d=x.data||x;if(t==='roomInfo'){status('Euler: connected to @'+cfg.user,true);continue}
    if(!/Gift/i.test(t)||d.giftId===undefined)continue;const det=d.giftDetails||d.gift||{};
    onGift({id:d.giftId||det.id,name:det.giftName||det.name||d.giftName,diamonds:det.diamondCount||d.diamondCount,repeat:d.repeatCount,repeatEnd:d.repeatEnd,combo:det.combo,giftType:det.giftType!==undefined?det.giftType:(det.type!==undefined?det.type:d.giftType),groupId:d.groupId,user:(d.user&&(d.user.userId||d.user.uniqueId))||'',msgId:d.common&&d.common.msgId})}
}
window.__euler=eulerMsg;
// ---------- remote control (control panel) ----------
const seenCmd=new Set();function cmd(c){if(!c||typeof c!=='object')return;if(c.k){if(seenCmd.has(c.k))return;seenCmd.add(c.k)}switch(c.cmd){case'start':start(c.t);break;case'reset':reset();break;case'end':end();break;case'add':addVotes(+c.i,+c.n||1,'manual');break;case'gift':onGift(c.g||{});break}}
window.__cmd=cmd;
if(cfg.room){
 const topic='giftvote_'+cfg.room.replace(/[^A-Za-z0-9_-]/g,'');
 try{new BroadcastChannel(topic).onmessage=e=>cmd(e.data)}catch(_){}
 let lastId='';const sse=()=>{const es=new EventSource('https://ntfy.sh/'+topic+'/sse'+(lastId?'?since='+lastId:''));
  es.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.event!=='message')return;lastId=m.id;if(Date.now()/1000-m.time>30)return;cmd(JSON.parse(m.message))}catch(_){}};
  es.onerror=()=>{};};sse();
}
// ---------- demo ----------
if(cfg.demo){
 const bias=[1.0,0.75,0.45];
 setInterval(()=>{if(S.phase!=='running')return;const r=Math.random()*bias.reduce((a,b)=>a+b);let i=0,acc=bias[0];while(r>acc&&i<2)acc+=bias[++i];
  const o=opts[i],grp=String(Math.random()),u='demo'+Math.floor(Math.random()*50),n=Math.random()<.25?2+Math.floor(Math.random()*4):1;
  if(n===1)onGift({id:o.id,name:o.gift,diamonds:o.coins,repeat:1,repeatEnd:true,giftType:2,user:u});
  else for(let k=1;k<=n;k++)setTimeout(()=>onGift({id:o.id,name:o.gift,diamonds:o.coins,repeat:k,repeatEnd:k===n,giftType:1,groupId:grp,user:u}),k*150)},450);
 status('DEMO MODE (simulated gifts)',true);
}else if(cfg.src==='euler'&&cfg.key)euler();else if(cfg.src==='tikfinity')tikfinity();
const pre=P('votes','');if(pre){S.phase='running';S.endAt=Date.now()+cfg.dur*1000;pre.split(',').forEach((v,i)=>opts[i]&&(opts[i].votes=parseInt(v)||0))}
draw();
if(cfg.demo||cfg.auto)start();
})();
</script>
